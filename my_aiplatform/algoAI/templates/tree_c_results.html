{% load static %}
{% include "includes/header.html" %}

<div class="container mt-4">
    <h2 class="text-center mb-4">Résultats</h2>

    <!-- Card principale -->
    <div class="card shadow p-4">

        <!-- Image -->
        <div class="text-center mb-3">
            <img src="{% static prediction_image %}" alt="Résultat météo" class="img-fluid" style="max-height:250px;">
        </div>

        <!-- Texte prédiction -->
        <h3 class="text-center">
              Prédiction : <strong>{{ prediction_texte }}</strong>
        </h3>

        <hr>

        <!-- Données d'entrée -->
        <h5 class="mb-3">📌 Données saisies :</h5>
        <ul class="list-group mb-4">
            {% for label, value in initial_data.items %}
                <li class="list-group-item d-flex justify-content-between">
                    <span>{{ label }}</span>
                    <strong>{{ value }}</strong>
                </li>
            {% endfor %}
        </ul>

        <!-- Boutons -->
        <div class="text-center">
            <a href="{% url 'tree_c_tester' %}" class="btn btn-primary me-2">🔄 Refaire un test</a>
            <a href="/" class="btn btn-secondary">🏠 Retour à l'accueil</a>
        </div>
    </div>
</div>
