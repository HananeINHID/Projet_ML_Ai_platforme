{% include "includes/header.html" %}
{% load static %}

<div class="container mt-4">

    <h2 class="mb-4">Résultat de la Prédiction</h2>

    <div class="row">
        <!-- Carte résultat -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    Classe prédite
                </div>
                <div class="card-body text-center">
                    <h3 class="mb-3">{{ prediction_texte }}</h3>
                    <img src="{% static prediction_image %}" alt="{{ prediction_texte }}" class="img-fluid rounded shadow-sm" style="max-height: 300px; object-fit: contain;">
                </div>
            </div>
        </div>

        <!-- Carte des données d'entrée -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    Valeurs saisies
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        {% for key, value in initial_data.items %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <strong>{{ key }} :</strong>
                            <span>{{ value }}</span>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Bouton retour -->
    <div class="mt-3">
        <a href="{% url 'tree_c_tester' %}" class="btn btn-success col-12">Retour au formulaire</a>
    </div>
</div>

{% include "includes/footer.html" %}
